<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Powerleads</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --preto-fundo: #0d0d0d;
    --preto-card: #1a1a1a;
    --dourado: #d4af37;
    --dourado-hover: #b8952e;
    --branco: #f5f5f0;
    --cinza: #a3a3a3;
    --borda: #333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; background: var(--preto-fundo);
    font-family: 'Segoe UI', Arial, sans-serif; color: var(--branco);
  }
  header {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    padding: 20px 40px; border-bottom: 1px solid var(--borda);
    background: var(--preto-card);
  }
  header h1 { color: var(--dourado); font-size: 20px; }
  #emailUsuario { color: var(--cinza); font-size: 14px; }
  button#btnSair {
    background: var(--dourado); color: #0d0d0d; border: none;
    padding: 8px 16px; border-radius: 8px; font-weight: bold;
    cursor: pointer; transition: background .2s;
  }
  button#btnSair:hover { background: var(--dourado-hover); }
  main {
    flex: 1; display: flex; justify-content: center; align-items: center;
    width: 100%;
  }
  .card {
    background: var(--preto-card); border: 1px solid var(--borda);
    padding: 40px; border-radius: 12px; text-align: center;
  }
  .card h2 { color: var(--dourado); margin-bottom: 10px; }
  .card p { color: var(--cinza); }
</style>
</head>
<body>
  <header>
    <h1>Powerleads</h1>
    <div>
      <span id="emailUsuario"></span>
      <button id="btnSair" onclick="fazerLogout()">Sair</button>
    </div>
  </header>

  <main>
    <div class="card">
      <h2>Bem-vindo ao Dashboard</h2>
      <p>Você está logado com sucesso.</p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://uifwnzgkxsacxpfnqbak.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpZnduemdreHNhY3hwZm5xYmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NjA4MzksImV4cCI6MjEwNDAzNjgzOX0.zMmM8cAjDQd9STev26mCGFXCoUdCWOArjAQus6dGZtU";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fazerLogout() {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    }

    // Protege a página: se não houver sessão, volta pro login
    supabaseClient.auth.getSession().then(({ data }) => {
      if (!data.session) {
        window.location.href = "index.html";
      } else {
        document.getElementById('emailUsuario').textContent = data.session.user.email;
      }
    });
  </script>
</body>
</html>
