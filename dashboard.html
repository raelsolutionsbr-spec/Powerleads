<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Leads</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #1e1e2f; color: white; padding: 30px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 10px; border-bottom: 1px solid #444; text-align: left; }
    th { background: #2a2a3d; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    button, a.btn { background: #4f46e5; color: white; padding: 8px 16px; border: none; border-radius: 5px; text-decoration: none; cursor: pointer; }
    .status { padding: 4px 10px; border-radius: 12px; font-size: 12px; }
    .novo { background: #3b82f6; }
    .contatado { background: #eab308; }
    .negociando { background: #f97316; }
    .fechado { background: #22c55e; }
  </style>
</head>
<body>
  <div class="top-bar">
    <h2>Painel de Leads</h2>
    <div>
      <a class="btn" href="cadastro.html">+ Novo Lead</a>
      <button onclick="sair()">Sair</button>
    </div>
  </div>

  <table>
    <thead>
      <tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Status</th></tr>
    </thead>
    <tbody id="tabela-leads"></tbody>
  </table>

  <script>
    const SUPABASE_URL = "https://uifwnzgkxsacxpfnqbak.supabase.co";
    const SUPABASE_ANON_KEY = "SUA_ANON_KEY_AQUI";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function verificarLogin() {
      const { data } = await supabase.auth.getSession();
      if (!data.session) window.location.href = "index.html";
    }

    async function carregarLeads() {
      const { data, error } = await supabase
        .from('leads')
        .select('*')
        .order('created_at', { ascending: false });

      const tabela = document.getElementById('tabela-leads');

      if (error) {
        tabela.innerHTML = `<tr><td colspan="4">Erro ao carregar: ${error.message}</td></tr>`;
        return;
      }

      tabela.innerHTML = data.map(lead => `
        <tr>
          <td>${lead.nome}</td>
          <td>${lead.telefone || '-'}</td>
          <td>${lead.email || '-'}</td>
          <td><span class="status ${lead.status}">${lead.status}</span></td>
        </tr>
      `).join('');
    }

    async function sair() {
      await supabase.auth.signOut();
      window.location.href = "index.html";
    }

    verificarLogin();
    carregarLeads();
  </script>
</body>
</html>
