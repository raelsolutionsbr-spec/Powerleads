<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Dashboard de Leads - Power Seguros</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: Arial, sans-serif; background: #0f1117; color: #eee; padding: 20px; }
  h1 { color: #4dd0e1; }
  .filtros { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
  select, input { padding: 6px; border-radius: 4px; border: none; background: #1f2230; color: #eee; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th, td { padding: 8px 12px; border-bottom: 1px solid #333; text-align: left; }
  th { background: #1f2230; color: #4dd0e1; }
  tr:hover { background: #1a1d29; }
  .badge { padding: 3px 8px; border-radius: 12px; font-size: 12px; }
  .quente { background: #e53935; }
  .morno { background: #fb8c00; }
  .frio { background: #1e88e5; }
  .novo { background: #43a047; }
  .fechado { background: #6d4c41; }
  .perdido { background: #757575; }
</style>
</head>
<body>

<h1>📋 Leads - Power Seguros</h1>

<div class="filtros">
  <select id="filtroStatus">
    <option value="">Todos os status</option>
    <option value="novo">Novo</option>
    <option value="em_contato">Em contato</option>
    <option value="negociando">Negociando</option>
    <option value="fechado">Fechado</option>
    <option value="perdido">Perdido</option>
  </select>

  <select id="filtroClassificacao">
    <option value="">Todas as classificações</option>
    <option value="quente">Quente</option>
    <option value="morno">Morno</option>
    <option value="frio">Frio</option>
  </select>

  <input type="text" id="buscaNome" placeholder="Buscar por nome ou CNPJ..." />
  <button onclick="carregarLeads()">🔄 Atualizar</button>
</div>

<table>
  <thead>
    <tr>
      <th>Nome</th>
      <th>CNPJ</th>
      <th>Telefone</th>
      <th>Qtd. Vidas</th>
      <th>Classificação</th>
      <th>Status</th>
      <th>Operadora Interesse</th>
      <th>Potencial</th>
      <th>Corretor</th>
      <th>Criado em</th>
    </tr>
  </thead>
  <tbody id="tabelaLeads">
    <tr><td colspan="10">Carregando...</td></tr>
  </tbody>
</table>

<script>
  const SUPABASE_URL = "SUA_URL_AQUI";
  const SUPABASE_KEY = "SUA_ANON_KEY_AQUI";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function carregarLeads() {
    const status = document.getElementById("filtroStatus").value;
    const classificacao = document.getElementById("filtroClassificacao").value;
    const busca = document.getElementById("buscaNome").value.trim();

    let query = supabase
      .from("leads")
      .select("*, corretores(nome)")
      .order("created_at", { ascending: false });

    if (status) query = query.eq("status", status);
    if (classificacao) query = query.eq("classificacao", classificacao);
    if (busca) query = query.or(`nome.ilike.%${busca}%,cnpj.ilike.%${busca}%`);

    const { data, error } = await query;
    const tbody = document.getElementById("tabelaLeads");

    if (error) {
      tbody.innerHTML = `<tr><td colspan="10">Erro: ${error.message}</td></tr>`;
      return;
    }

    if (!data || data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="10">Nenhum lead encontrado.</td></tr>`;
      return;
    }

    tbody.innerHTML = data.map(lead => `
      <tr>
        <td>${lead.nome || "-"}</td>
        <td>${lead.cnpj || "-"}</td>
        <td>${lead.telefone || "-"}</td>
        <td>${lead.qtd_vidas ?? "-"}</td>
        <td><span class="badge ${lead.classificacao || ''}">${lead.classificacao || "-"}</span></td>
        <td><span class="badge ${lead.status || ''}">${lead.status || "-"}</span></td>
        <td>${lead.operadora_interesse || "-"}</td>
        <td>${lead.potencial || "-"}</td>
        <td>${lead.corretores?.nome || "Não atribuído"}</td>
        <td>${lead.created_at ? new Date(lead.created_at).toLocaleDateString('pt-BR') : "-"}</td>
      </tr>
    `).join("");
  }

  document.getElementById("filtroStatus").addEventListener("change", carregarLeads);
  document.getElementById("filtroClassificacao").addEventListener("change", carregarLeads);
  document.getElementById("buscaNome").addEventListener("keyup", (e) => {
    if (e.key === "Enter") carregarLeads();
  });

  carregarLeads();
</script>

</body>
</html>
