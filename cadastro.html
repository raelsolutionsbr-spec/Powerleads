<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Lead</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #1e1e2f; color: white; padding: 40px; }
    .box { max-width: 400px; margin: auto; background: #2a2a3d; padding: 30px; border-radius: 10px; }
    input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; }
    button { width: 100%; padding: 10px; background: #4f46e5; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    #msg { text-align: center; margin-top: 10px; }
    a { color: #a5b4fc; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Cadastrar Lead</h2>
    <input type="text" id="nome" placeholder="Nome do lead">
    <input type="text" id="telefone" placeholder="Telefone">
    <input type="email" id="email" placeholder="E-mail">
    <select id="status">
      <option value="novo">Novo</option>
      <option value="contatado">Contatado</option>
      <option value="negociando">Negociando</option>
      <option value="fechado">Fechado</option>
    </select>
    <button onclick="cadastrarLead()">Salvar Lead</button>
    <p id="msg"></p>
    <p><a href="dashboard.html">← Voltar ao painel</a></p>
  </div>

  <script>
    const SUPABASE_URL = "https://uifwnzgkxsacxpfnqbak.supabase.co";
    const SUPABASE_ANON_KEY = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpZnduemdreHNhY3hwZm5xYmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NjA4MzksImV4cCI6MjEwNDAzNjgzOX0.zMmM8cAjDQd9STev26mCGFXCoUdCWOArjAQus6dGZtU
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function cadastrarLead() {
      const nome = document.getElementById('nome').value;
      const telefone = document.getElementById('telefone').value;
      const email = document.getElementById('email').value;
      const status = document.getElementById('status').value;
      const msgEl = document.getElementById('msg');

      if (!nome) {
        msgEl.textContent = "Nome é obrigatório!";
        msgEl.style.color = "#ff6b6b";
        return;
      }

      const { error } = await supabase
        .from('leads')
        .insert([{ nome, telefone, email, status }]);

      if (error) {
        msgEl.textContent = "Erro: " + error.message;
        msgEl.style.color = "#ff6b6b";
      } else {
        msgEl.textContent = "Lead cadastrado com sucesso!";
        msgEl.style.color = "#4ade80";
        document.getElementById('nome').value = '';
        document.getElementById('telefone').value = '';
        document.getElementById('email').value = '';
      }
    }
  </script>
</body>
</html>
