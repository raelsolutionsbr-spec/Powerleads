<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Powerleads</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --preto-fundo: #0d0d0d;
    --preto-card: #1a1a1a;
    --dourado: #d4af37;
    --dourado-hover: #b8952e;
    --branco: #f5f5f0;
    --cinza: #a3a3a3;
    --borda: #333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    display: flex; justify-content: center; align-items: center;
    height: 100vh; background: var(--preto-fundo);
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .box {
    background: var(--preto-card); border: 1px solid var(--borda);
    padding: 40px; border-radius: 12px; width: 320px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  h2 { color: var(--dourado); text-align: center; margin-bottom: 20px; }
  input {
    width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px;
    border: 1px solid var(--borda); background: #0d0d0d; color: var(--branco);
    outline: none;
  }
  input:focus { border-color: var(--dourado); }
  button {
    width: 100%; padding: 12px; background: var(--dourado); color: #0d0d0d;
    border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    margin-top: 10px; transition: background .2s;
  }
  button:hover { background: var(--dourado-hover); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  #msg { font-size: 13px; text-align: center; margin-top: 10px; min-height: 16px; }
  .link { display: block; text-align: center; margin-top: 15px; color: var(--cinza); font-size: 13px; text-decoration: none; }
  .link:hover { color: var(--dourado); }
</style>
</head>
<body>
  <div class="box">
    <h2>Criar Conta</h2>
    <input type="email" id="email" placeholder="E-mail">
    <input type="password" id="senha" placeholder="Senha (mín. 6 caracteres)">
    <button id="btnCadastrar" onclick="fazerCadastro()">Cadastrar</button>
    <p id="msg"></p>
    <a href="index.html" class="link">Já tem conta? Fazer login</a>
  </div>

  <script>
    const SUPABASE_URL = "https://uifwnzgkxsacxpfnqbak.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpZnduemdreHNhY3hwZm5xYmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NjA4MzksImV4cCI6MjEwNDAzNjgzOX0.zMmM8cAjDQd9STev26mCGFXCoUdCWOArjAQus6dGZtU";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fazerCadastro() {
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const msgEl = document.getElementById('msg');
      const btn = document.getElementById('btnCadastrar');

      msgEl.style.color = "#ff6b6b";
      msgEl.textContent = "";

      if (!email || !senha) {
        msgEl.textContent = "Preencha e-mail e senha.";
        return;
      }
      if (senha.length < 6) {
        msgEl.textContent = "A senha deve ter no mínimo 6 caracteres.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Cadastrando...";

      const { error } = await supabaseClient.auth.signUp({ email, password: senha });

      btn.disabled = false;
      btn.textContent = "Cadastrar";

      if (error) {
        msgEl.textContent = "Erro: " + error.message;
        return;
      }

      msgEl.style.color = "lightgreen";
      msgEl.textContent = "Cadastro realizado! Verifique seu e-mail para confirmar.";
    }

    document.getElementById('senha').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') fazerCadastro();
    });
  </script>
</body>
</html>
