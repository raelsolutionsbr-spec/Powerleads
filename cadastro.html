<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cadastro de Lead - Power Seguros</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --preto-fundo: #0d0d0d;
    --preto-card: #1a1a1a;
    --dourado: #d4af37;
    --dourado-hover: #b8952e;
    --branco: #f5f5f0;
    --cinza: #a3a3a3;
    --borda: #333;
    --erro: #ff6b6b;
    --sucesso: #4caf50;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; background: var(--preto-fundo);
    font-family: 'Segoe UI', Arial, sans-serif; color: var(--branco);
    padding-bottom: 40px;
  }
  header {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    padding: 20px 40px; border-bottom: 1px solid var(--borda);
    background: var(--preto-card);
    flex-wrap: wrap; gap: 10px;
  }
  header h1 { color: var(--dourado); font-size: 20px; }
  .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  header a, header button {
    color: var(--dourado); text-decoration: none; font-size: 14px;
    border: 1px solid var(--dourado); padding: 8px 16px; border-radius: 8px;
    background: transparent; cursor: pointer; font-family: inherit;
  }
  header a:hover, header button:hover { background: var(--dourado); color: #0d0d0d; }
  main { flex: 1; width: 100%; display: flex; justify-content: center; padding: 40px 20px; }
  .card {
    background: var(--preto-card); border: 1px solid var(--borda);
    padding: 30px; border-radius: 12px; width: 100%; max-width: 700px;
  }
  .card h2 { color: var(--dourado); margin-bottom: 20px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .campo { margin-bottom: 15px; }
  .campo.full { grid-column: 1 / -1; }
  label { display: block; font-size: 13px; color: var(--cinza); margin-bottom: 5px; }
  input, select, textarea {
    width: 100%; padding: 10px; border-radius: 8px;
    border: 1px solid var(--borda); background: #111; color: var(--branco);
    font-size: 14px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--dourado); }
  textarea { resize: vertical; min-height: 70px; }
  .obrigatorio { color: var(--erro); }
  .dica { font-size: 12px; color: var(--cinza); margin-top: 4px; }
  button#btnSalvar {
    margin-top: 10px; width: 100%; background: var(--dourado); color: #0d0d0d;
    border: none; padding: 14px; border-radius: 8px; font-weight: bold;
    font-size: 15px; cursor: pointer; transition: background .2s;
  }
  button#btnSalvar:hover { background: var(--dourado-hover); }
  button#btnSalvar:disabled { opacity: .6; cursor: not-allowed; }
  #mensagem {
    margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 14px; display: none;
  }
  #mensagem.erro { background: rgba(255,107,107,.15); color: var(--erro); border: 1px solid var(--erro); }
  #mensagem.sucesso { background: rgba(76,175,80,.15); color: var(--sucesso); border: 1px solid var(--sucesso); }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } }

  footer {
    text-align: center; padding: 16px 8px; font-size: 12px; color: #666;
    width: 100%;
  }
</style>
</head>
<body>

<header>
  <h1>Powerleads</h1>
  <div class="header-actions">
    <a href="manual.html" target="_blank">📖 Manual</a>
    <a href="dashboard.html">← Voltar ao Dashboard</a>
    <button onclick="sair()">Sair</button>
  </div>
</header>

<main>
  <div class="card">
    <h2>Cadastrar Novo Lead</h2>

    <form id="formLead">
      <div class="grid2">
        <div class="campo full">
          <label>Nome / Razão Social <span class="obrigatorio">*</span></label>
          <input type="text" id="nome" required />
        </div>

        <div class="campo">
          <label>Telefone</label>
          <input type="text" id="telefone" placeholder="(11) 99999-9999" />
        </div>

        <div class="campo">
          <label>E-mail</label>
          <input type="email" id="email" />
        </div>

        <div class="campo">
          <label>CNPJ</label>
          <input type="text" id="cnpj" placeholder="00.000.000/0000-00" />
        </div>

        <div class="campo">
          <label>Quantidade de Vidas <span class="obrigatorio">*</span></label>
          <input type="number" id="qtd_vidas" min="0" required />
          <p class="dica">O porte (pequeno/médio/grande) é calculado automaticamente pelo sistema.</p>
        </div>

        <div class="campo">
          <label>Classificação</label>
          <select id="classificacao">
            <option value="">Selecione</option>
            <option value="quente">🔥 Quente</option>
            <option value="morno">🟠 Morno</option>
            <option value="frio">🔵 Frio</option>
          </select>
        </div>

        <div class="campo">
          <label>Status</label>
          <select id="status">
            <option value="novo">Novo</option>
            <option value="em_contato">Em contato</option>
            <option value="negociando">Negociando</option>
            <option value="fechado">Fechado</option>
            <option value="perdido">Perdido</option>
          </select>
        </div>

        <div class="campo">
          <label>Origem</label>
          <select id="origem">
            <option value="">Selecione</option>
            <option value="site">Site</option>
            <option value="indicacao">Indicação</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="instagram">Instagram</option>
            <option value="google">Google Ads</option>
            <option value="outro">Outro</option>
          </select>
        </div>

        <div class="campo">
          <label>Operadora de Interesse</label>
          <input type="text" id="operadora_interesse" placeholder="Ex: Unimed, Bradesco..." />
        </div>

        <div class="campo">
          <label>Potencial</label>
          <select id="potencial">
            <option value="">Selecione</option>
            <option value="alto">Alto</option>
            <option value="medio">Médio</option>
            <option value="baixo">Baixo</option>
          </select>
        </div>

        <div class="campo full">
          <label>Corretor Responsável (opcional — a Fila de Distribuição pode sugerir depois)</label>
          <select id="corretor_id">
            <option value="">Não atribuído</option>
          </select>
        </div>

        <div class="campo full">
          <label>Observações</label>
          <textarea id="observacoes"></textarea>
        </div>
      </div>

      <button type="submit" id="btnSalvar">💾 Salvar Lead</button>
      <div id="mensagem"></div>
    </form>
  </div>
</main>

<footer>
  Sistema desenvolvido por
  <span style="color: #1e40af; font-weight: 600;">RaelSolutions - Desenvolvimento de Software</span>
</footer>

<script>
  const SUPABASE_URL = "https://uifwnzgkxsacxpfnqbak.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpZnduemdreHNhY3hwZm5xYmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NjA4MzksImV4cCI6MjEwNDAzNjgzOX0.zMmM8cAjDQd9STev26mCGFXCoUdCWOArjAQus6dGZtU";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function sair() {
    supabaseClient.auth.signOut();
    window.location.href = "index.html";
  }

  supabaseClient.auth.getSession().then(({ data }) => {
    if (!data.session) window.location.href = "index.html";
    else carregarCorretores();
  });

  async function carregarCorretores() {
    const { data, error } = await supabaseClient
      .from('corretores')
      .select('id, nome')
      .eq('ativo', true)
      .order('nome');

    if (error || !data) return;

    const select = document.getElementById('corretor_id');
    data.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.nome;
      select.appendChild(opt);
    });
  }

  function mostrarMensagem(texto, tipo) {
    const el = document.getElementById('mensagem');
    el.textContent = texto;
    el.className = tipo;
    el.style.display = 'block';
  }

  document.getElementById('formLead').addEventListener('submit', async (e) => {
    e.preventDefault();

    const btn = document.getElementById('btnSalvar');
    btn.disabled = true;
    btn.textContent = "Salvando...";

    const novoLead = {
      nome: document.getElementById('nome').value.trim(),
      telefone: document.getElementById('telefone').value.trim() || null,
      email: document.getElementById('email').value.trim() || null,
      cnpj: document.getElementById('cnpj').value.trim() || null,
      qtd_vidas: document.getElementById('qtd_vidas').value ? parseInt(document.getElementById('qtd_vidas').value) : null,
      classificacao: document.getElementById('classificacao').value || null,
      status: document.getElementById('status').value || 'novo',
      origem: document.getElementById('origem').value || null,
      operadora_interesse: document.getElementById('operadora_interesse').value.trim() || null,
      potencial: document.getElementById('potencial').value || null,
      corretor_id: document.getElementById('corretor_id').value || null,
      observacoes: document.getElementById('observacoes').value.trim() || null
    };

    const { data: leadInserido, error: erroLead } = await supabaseClient
      .from('leads')
      .insert(novoLead)
      .select()
      .single();

    if (erroLead) {
      mostrarMensagem("Erro ao salvar lead: " + erroLead.message, "erro");
      btn.disabled = false;
      btn.textContent = "💾 Salvar Lead";
      return;
    }

    try {
      const { data: sessao } = await supabaseClient.auth.getSession();
      const emailUsuario = sessao.session?.user?.email || "sistema";

      const { error: erroHistorico } = await supabaseClient.from('historico_leads').insert({
        lead_id: leadInserido.id,
        usuario: emailUsuario,
        acao: "criacao",
        observacao: "Lead cadastrado via formulário."
      });

      if (erroHistorico) {
        console.warn("Lead salvo, mas houve erro ao registrar histórico:", erroHistorico.message);
      }
    } catch (e) {
      console.warn("Falha ao registrar histórico do lead:", e);
    }

    mostrarMensagem("✅ Lead cadastrado com sucesso!", "sucesso");
    document.getElementById('formLead').reset();
    btn.disabled = false;
    btn.textContent = "💾 Salvar Lead";

    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 1500);
  });
</script>

</body>
</html>
