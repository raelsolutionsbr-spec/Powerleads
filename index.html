<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login - Powerleads</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --preto-fundo: #0d0d0d;
    --preto-card: #1a1a1a;
    --dourado: #d4af37;
    --dourado-hover: #b8952e;
    --branco: #f5f5f0;
    --cinza: #a3a3a3;
    --borda: #333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    display: flex; justify-content: center; align-items: center;
    height: 100vh; background: var(--preto-fundo);
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .box {
    background: var(--preto-card); border: 1px solid var(--borda);
    padding: 40px; border-radius: 12px; width: 320px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  h2 { color: var(--dourado); text-align: center; margin-bottom: 20px; }
  input {
    width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px;
    border: 1px solid var(--borda); background: #0d0d0d; color: var(--branco);
    outline: none;
  }
  input:focus { border-color: var(--dourado); }
  button {
    width: 100%; padding: 12px; background: var(--dourado); color: #0d0d0d;
    border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    margin-top: 10px; transition: background .2s;
  }
  button:hover { background: var(--dourado-hover); }
  #erro { color: #ff6b6b; font-size: 13px; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
  <div class="box">
    <h2>Powerleads</h2>
    <input type="email" id="email" placeholder="E-mail">
    <input type="password" id="senha" placeholder="Senha">
    <button onclick="fazerLogin()">Entrar</button>
    <p id="erro"></p>
  </div>

  <script>
    const SUPABASE_URL = "https://uifwnzgkxsacxpfnqbak.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpZnduemdreHNhY3hwZm5xYmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NjA4MzksImV4cCI6MjEwNDAzNjgzOX0.zMmM8cAjDQd9STev26mCGFXCoUdCWOArjAQus6dGZtU";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fazerLogin() {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const erroEl = document.getElementById('erro');

      const { error } = await supabase.auth.signInWithPassword({ email, password: senha });

      if (error) {
        erroEl.textContent = "Erro: " + error.message;
        return;
      }
      window.location.href = "dashboard.html";
    }

    supabase.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
