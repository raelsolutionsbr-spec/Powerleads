<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fila de Distribuição de Leads - Power Seguros</title>
<style>
  :root {
    --preto-fundo: #0d0d0d;
    --preto-card: #1a1a1a;
    --dourado: #d4af37;
    --dourado-hover: #b8952e;
    --branco: #f5f5f0;
    --cinza: #a3a3a3;
    --borda: #333;
    --sucesso: #4caf50;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--preto-fundo);
    color: var(--branco);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding-bottom: 20px;
  }

  header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    border-bottom: 1px solid var(--borda);
    background: var(--preto-card);
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 {
    color: var(--dourado);
    font-size: 20px;
  }
  .header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  header a, header button {
    color: var(--dourado);
    text-decoration: none;
    font-size: 14px;
    border: 1px solid var(--dourado);
    padding: 8px 16px;
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    transition: background .2s, color .2s;
  }
  header a:hover, header button:hover {
    background: var(--dourado);
    color: #0d0d0d;
  }

  main {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }

  .container {
    max-width: 900px;
    width: 100%;
  }

  h2.titulo {
    text-align: center;
    color: var(--dourado);
    margin-bottom: 30px;
    font-size: 24px;
    letter-spacing: .5px;
  }

  .lead-card {
    background: var(--preto-card);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    transition: border-color .2s, transform .2s;
  }
  .lead-card:hover {
    border-color: var(--dourado);
    transform: translateY(-2px);
  }

  .lead-info h3 {
    margin: 0 0 8px;
    color: var(--dourado);
    font-size: 17px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .lead-info p {
    margin: 3px 0;
    color: var(--cinza);
    font-size: 14px;
  }
  .lead-info p strong {
    color: var(--branco);
  }

  .badge {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    color: #0d0d0d;
    text-transform: uppercase;
    letter-spacing: .3px;
  }
  .badge-pequeno { background: #6cb2eb; }
  .badge-medio   { background: var(--dourado); }
  .badge-grande  { background: #e07856; }

  .btn-confirmar {
    background: var(--dourado);
    color: #0d0d0d;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: background .2s;
    white-space: nowrap;
  }
  .btn-confirmar:hover { background: var(--dourado-hover); }
  .btn-confirmar:disabled {
    background: #444;
    color: #888;
    cursor: not-allowed;
  }

  .empty {
    text-align: center;
    color: var(--cinza);
    margin-top: 40px;
    font-size: 16px;
    background: var(--preto-card);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 30px;
  }

  .loading {
    text-align: center;
    color: var(--cinza);
    margin-top: 40px;
    font-size: 15px;
  }

  footer {
    text-align: center;
    padding: 16px 8px;
    font-size: 12px;
    color: #666;
    width: 100%;
  }

  @media (max-width: 600px) {
    .lead-card { flex-direction: column; align-items: flex-start; }
    .btn-confirmar { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1>Powerleads</h1>
  <div class="header-actions">
 <a href="https://raelsolutionsbr-spec.github.io/manuais-distribuidordeleads/manual-admin.html" target="_blank">📖 Manual</a>
   <a href="dashboard.html">← Voltar ao Dashboard</a>
    <button onclick="sair()">Sair</button>
  </div>
</header>

<main>
  <div class="container">
    <h2 class="titulo">📋 Fila de Distribuição de Leads</h2>
    <div id="listaLeads" class="loading">Carregando leads...</div>
  </div>
</main>

<footer>
  Sistema desenvolvido por
  <span style="color: var(--dourado); font-weight: 600;">RaelSolutions - Desenvolvimento de Software</span>
</footer>

<!-- Biblioteca do Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://uifwnzgkxsacxpfnqbak.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpZnduemdreHNhY3hwZm5xYmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NjA4MzksImV4cCI6MjEwNDAzNjgzOX0.zMmM8cAjDQd9STev26mCGFXCoUdCWOArjAQus6dGZtU";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const listaLeads = document.getElementById("listaLeads");

  function sair() {
    supabaseClient.auth.signOut();
    window.location.href = "index.html";
  }

  async function verificarSessao() {
    const { data } = await supabaseClient.auth.getSession();
    if (!data.session) {
      window.location.href = "index.html";
      return false;
    }
    return true;
  }

  function classePorte(porte) {
    if (porte === "pequeno") return "badge-pequeno";
    if (porte === "medio") return "badge-medio";
    if (porte === "grande") return "badge-grande";
    return "";
  }

  async function carregarLeads() {
    listaLeads.className = "loading";
    listaLeads.innerHTML = "Carregando leads...";

    const { data: leads, error } = await supabaseClient
      .from("leads")
      .select("*")
      .is("corretor_id", null)
      .order("created_at", { ascending: true });

    if (error) {
      listaLeads.className = "empty";
      listaLeads.innerHTML = `Erro ao carregar leads: ${error.message}`;
      return;
    }

    if (!leads || leads.length === 0) {
      listaLeads.className = "empty";
      listaLeads.innerHTML = `Nenhum lead pendente no momento 🎉`;
      return;
    }

    listaLeads.className = "";
    listaLeads.innerHTML = "";

    for (const lead of leads) {
      const corretorSugerido = await sugerirCorretor(lead);
      const card = document.createElement("div");
      card.className = "lead-card";

      card.innerHTML = `
        <div class="lead-info">
          <h3>${lead.nome || "Sem nome"}
            <span class="badge ${classePorte(lead.porte)}">${lead.porte || "-"}</span>
          </h3>
          <p>📞 ${lead.telefone || "Sem telefone"}</p>
          <p>👥 Vidas: <strong>${lead.qtd_vidas ?? "-"}</strong></p>
          <p>🧑‍💼 Corretor sugerido: <strong>${corretorSugerido ? corretorSugerido.nome : "Nenhum disponível"}</strong></p>
        </div>
        <button class="btn-confirmar" ${!corretorSugerido ? "disabled" : ""}>
          ✅ Confirmar e Disparar WhatsApp
        </button>
      `;

      const btn = card.querySelector("button");
      btn.addEventListener("click", () => confirmarDistribuicao(lead, corretorSugerido));

      listaLeads.appendChild(card);
    }
  }

  async function sugerirCorretor(lead) {
    const { data: corretores, error } = await supabaseClient
      .from("corretores")
      .select("*")
      .eq("ativo", true)
      .lte("leads_hoje", 4)
      .order("leads_hoje", { ascending: true })
      .limit(1);

    if (error || !corretores || corretores.length === 0) return null;
    return corretores[0];
  }

  async function confirmarDistribuicao(lead, corretor) {
    if (!corretor) return;

    const { error } = await supabaseClient
      .from("leads")
      .update({
        corretor_id: corretor.id,
        status: "atribuido",
        atribuido_em: new Date().toISOString()
      })
      .eq("id", lead.id);

    if (error) {
      alert("Erro ao confirmar distribuição: " + error.message);
      return;
    }

    const mensagem = encodeURIComponent(
      `Olá ${corretor.nome}! Você recebeu um novo lead:\n\n` +
      `Nome: ${lead.nome}\n` +
      `Telefone: ${lead.telefone}\n` +
      `Qtd. de vidas: ${lead.qtd_vidas}\n` +
      `Porte: ${lead.porte}\n\n` +
      `Por favor, entre em contato o mais rápido possível!`
    );

    const numeroCorretor = corretor.telefone.replace(/\D/g, "");
    const linkWhatsApp = `https://wa.me/55${numeroCorretor}?text=${mensagem}`;

    window.open(linkWhatsApp, "_blank");

    carregarLeads();
  }

  async function init() {
    const logado = await verificarSessao();
    if (logado) carregarLeads();
  }

  init();
</script>

</body>
</html>
